name: Actualizar contador VAKI

# Corre el agente que lee el recaudo de la VAKI y actualiza vaki.json.
# Si el valor cambió, hace commit → Vercel redespliega solo → la web muestra el nuevo monto.

on:
  schedule:
    - cron: '*/30 * * * *'   # cada 30 minutos (hora UTC)
  workflow_dispatch: {}       # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write             # necesario para commitear vaki.json

concurrency:
  group: actualizar-vaki
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Instalar navegador (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Leer recaudo de la VAKI
        run: node agente-vaki.mjs

      - name: Commit si cambió
        run: |
          if ! git diff --quiet -- vaki.json; then
            git config user.name "vaki-bot"
            git config user.email "actions@users.noreply.github.com"
            git add vaki.json
            git commit -m "chore: actualizar recaudo VAKI [skip ci]"
            git push
          else
            echo "vaki.json sin cambios; no se hace commit."
          fi
